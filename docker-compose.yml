services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: foodies
      MYSQL_USER: foodies
      MYSQL_PASSWORD: foodies_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/recipes_schema.sql:/docker-entrypoint-initdb.d/02-recipes.sql:ro
      - ./backend/db/reviews_schema.sql:/docker-entrypoint-initdb.d/03-reviews.sql:ro
      - ./backend/db/collections_schema.sql:/docker-entrypoint-initdb.d/04-collections.sql:ro
      - ./backend/db/bookmarks_schema.sql:/docker-entrypoint-initdb.d/05-bookmarks.sql:ro
      - ./backend/db/activity_schema.sql:/docker-entrypoint-initdb.d/06-activity.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: foodies
      MYSQL_PASSWORD: foodies_local_password
      MYSQL_DATABASE: foodies
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  uploads_data:
